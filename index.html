<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Такси Престиж | Вход и регистрация</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;500;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --yellow: #FFD600;
            --yellow-dark: #FFC400;
            --black: #191A1E;
            --gray: #f5f5f5;
            --input-bg: #232323;
            --input-border: #FFD600;
        }
        body {
            background: var(--black);
            font-family: 'Montserrat', Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .taxi-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(135deg, var(--yellow) 0%, var(--black) 100%);
            opacity: 0.08;
            z-index: 0;
        }
        .container {
            position: relative;
            z-index: 1;
            background: rgba(25,26,30,0.98);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
            max-width: 370px;
            width: 100%;
            padding: 40px 28px 32px 28px;
            margin: 32px 0;
            animation: fadeInUp 1s cubic-bezier(.7,0,.3,1);
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }
        .logo-icon {
            font-size: 2.2rem;
            color: var(--yellow);
            margin-right: 10px;
            animation: taxiWiggle 1.5s infinite alternate;
        }
        @keyframes taxiWiggle {
            0% { transform: rotate(-7deg); }
            100% { transform: rotate(7deg); }
        }
        .logo-text {
            font-size: 1.7rem;
            font-weight: 700;
            color: var(--yellow);
            letter-spacing: 2px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }
        h1 {
            color: #fff;
            font-size: 1.35rem;
            font-weight: 600;
            margin-bottom: 18px;
            letter-spacing: 1px;
        }
        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: var(--yellow);
            font-size: 1rem;
        }
        input[type="text"], input[type="password"], input[type="tel"] {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid var(--input-border);
            border-radius: 8px;
            font-size: 1rem;
            background: var(--input-bg);
            color: #fff;
            outline: none;
            transition: border 0.2s;
        }
        input[type="text"]:focus, input[type="password"]:focus, input[type="tel"]:focus {
            border-color: var(--yellow-dark);
        }
        button {
            width: 100%;
            padding: 13px 0;
            background: linear-gradient(90deg, var(--yellow) 60%, var(--yellow-dark) 100%);
            color: var(--black);
            font-size: 1.1rem;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 8px;
            box-shadow: 0 2px 8px rgba(255,214,0,0.10);
            transition: background 0.2s, transform 0.15s;
            letter-spacing: 1px;
        }
        button:active {
            background: var(--yellow-dark);
            transform: scale(0.98);
        }
        .switch-link {
            color: var(--yellow);
            cursor: pointer;
            text-decoration: underline;
            font-size: 1rem;
            margin-top: 16px;
            display: inline-block;
            transition: color 0.2s;
        }
        .switch-link:hover {
            color: #fff200;
        }
        .error {
            color: #ff5252;
            margin-bottom: 10px;
            text-align: center;
            font-size: 1rem;
            min-height: 22px;
            transition: opacity 0.3s;
        }
        .success {
            color: #388e3c;
            margin-bottom: 10px;
            text-align: center;
            font-size: 1rem;
        }
        #main-content {
            display: none;
            text-align: center;
            animation: fadeInUp 0.7s;
        }
        .taxi-divider {
            width: 100%;
            height: 2px;
            background: repeating-linear-gradient(90deg, var(--yellow), var(--yellow) 16px, var(--black) 16px, var(--black) 32px);
            border-radius: 2px;
            margin: 24px 0 18px 0;
            opacity: 0.7;
        }
        @media (max-width: 500px) {
            .container { padding: 24px 6vw 18px 6vw; }
            .logo-text { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="taxi-bg"></div>
    <div class="container">
        <div class="logo">
            <span class="logo-icon"><i class="fa-solid fa-taxi"></i></span>
            <span class="logo-text">Такси Престиж</span>
        </div>
        <h1 id="form-title">Регистрация</h1>
        <div class="taxi-divider"></div>
        <div id="error-message" class="error"></div>
        <form id="register-form">
            <div class="form-group">
                <label for="phone"><i class="fa-solid fa-phone"></i> Номер телефона</label>
                <input type="tel" id="phone" name="phone" placeholder="+7 999 123-45-67" required pattern="\+7\s?\d{3}\s?\d{3}-?\d{2}-?\d{2}">
            </div>
            <div class="form-group">
                <label for="password"><i class="fa-solid fa-lock"></i> Пароль</label>
                <input type="password" id="password" name="password" placeholder="Пароль" required minlength="6">
            </div>
            <button type="submit"><i class="fa-solid fa-user-plus"></i> Зарегистрироваться</button>
            <div class="switch-link" id="to-login">Уже есть аккаунт? Войти</div>
        </form>
        <form id="login-form" style="display:none;">
            <div class="form-group">
                <label for="login-phone"><i class="fa-solid fa-phone"></i> Номер телефона</label>
                <input type="tel" id="login-phone" name="login-phone" placeholder="+7 999 123-45-67" required pattern="\+7\s?\d{3}\s?\d{3}-?\d{2}-?\d{2}">
            </div>
            <div class="form-group">
                <label for="login-password"><i class="fa-solid fa-lock"></i> Пароль</label>
                <input type="password" id="login-password" name="login-password" placeholder="Пароль" required minlength="6">
            </div>
            <button type="submit"><i class="fa-solid fa-sign-in-alt"></i> Войти</button>
            <div class="switch-link" id="to-register">Нет аккаунта? Зарегистрироваться</div>
        </form>
        <div id="main-content">
            <h2 style="color:var(--yellow);margin-bottom:12px;"><i class="fa-solid fa-circle-check"></i> Добро пожаловать!</h2>
            <p style="color:#fff;">Вы успешно вошли в систему.</p>
            <button onclick="logout()"><i class="fa-solid fa-arrow-right-from-bracket"></i> Выйти</button>
        </div>
    </div>
    <script>
        // === ВСТАВЬТЕ СЮДА СВОЙ URL и API TOKEN NocoDB ===
        const NOCODB_API_URL = 'https://app.nocodb.com/api/v2/tables/mqeutwuzi6xcgzm/records';
        const NOCODB_API_TOKEN = 'yspnh53Npaci_3z-zGrQlZXGxhOuPp6sFOYuXEUs';

        // Проверка авторизации при загрузке
        document.addEventListener('DOMContentLoaded', async () => {
            const phone = localStorage.getItem('phone');
            if (phone) {
                showMainContent();
            }
        });

        // Переключение форм с анимацией
        function switchForm(showLogin) {
            document.getElementById('register-form').style.display = showLogin ? 'none' : 'block';
            document.getElementById('login-form').style.display = showLogin ? 'block' : 'none';
            document.getElementById('form-title').textContent = showLogin ? 'Вход' : 'Регистрация';
            document.getElementById('error-message').textContent = '';
            document.querySelector('.taxi-divider').style.animation = 'fadeInUp 0.5s';
        }
        document.getElementById('to-login').onclick = function() { switchForm(true); };
        document.getElementById('to-register').onclick = function() { switchForm(false); };

        // Регистрация
        document.getElementById('register-form').onsubmit = async function(e) {
            e.preventDefault();
            document.getElementById('error-message').textContent = '';
            const phone = document.getElementById('phone').value.replace(/\s|-/g, '');
            const password = document.getElementById('password').value;
            if (password.length < 6) {
                showError('Пароль должен быть не менее 6 символов');
                return;
            }
            // Проверяем, есть ли уже такой пользователь
            const exists = await findUser(phone);
            if (exists) {
                showError('Пользователь с таким номером уже зарегистрирован');
                return;
            }
            // Регистрируем (NocoDB v2 требует поля в объекте fields)
            const res = await fetch(NOCODB_API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'xc-token': NOCODB_API_TOKEN
                },
                body: JSON.stringify({ fields: { phone, password } })
            });
            if (!res.ok) {
                let msg = 'Ошибка регистрации';
                try { const err = await res.json(); msg += ': ' + (err.message || JSON.stringify(err)); } catch {}
                showError(msg);
                return;
            }
            localStorage.setItem('phone', phone);
            document.getElementById('register-form').style.display = 'none';
            // showMainContent();
            window.location.href = 'taxi.html';
        };

        // Вход
        document.getElementById('login-form').onsubmit = async function(e) {
            e.preventDefault();
            document.getElementById('error-message').textContent = '';
            const phone = document.getElementById('login-phone').value.replace(/\s|-/g, '');
            const password = document.getElementById('login-password').value;
            const user = await findUser(phone);
            if (!user) {
                showError('Пользователь не найден');
                return;
            }
            if (user.password !== password) {
                showError('Неверный пароль');
                return;
            }
            localStorage.setItem('phone', phone);
            document.getElementById('login-form').style.display = 'none';
            showMainContent();
        };

        async function findUser(phone) {
            const where = encodeURIComponent(JSON.stringify([["phone", "eq", phone]]));
            const url = NOCODB_API_URL + `?where=${where}`;
            const res = await fetch(url, {
                headers: {
                    'xc-token': NOCODB_API_TOKEN
                }
            });
            if (!res.ok) return null;
            const data = await res.json();
            if (data && data.list && data.list.length > 0) {
                return data.list[0].fields;
            }
            return null;
        }

        function showMainContent() {
            document.getElementById('main-content').style.display = 'block';
            document.getElementById('register-form').style.display = 'none';
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('form-title').textContent = '';
            document.getElementById('error-message').textContent = '';
        }

        function logout() {
            localStorage.removeItem('phone');
            location.reload();
        }

        function showError(msg) {
            const err = document.getElementById('error-message');
            err.textContent = msg;
            err.style.opacity = 1;
            err.style.animation = 'shake 0.4s';
            setTimeout(()=>{err.style.animation='';}, 400);
        }
        // Shake animation
        const style = document.createElement('style');
        style.innerHTML = `@keyframes shake { 0%{transform:translateX(0);} 20%{transform:translateX(-8px);} 40%{transform:translateX(8px);} 60%{transform:translateX(-8px);} 80%{transform:translateX(8px);} 100%{transform:translateX(0);} }`;
        document.head.appendChild(style);
    </script>
    <!--
    === КАК НАСТРОИТЬ ===
    1. Разверните NocoDB (локально или в облаке).
    2. Создайте проект и таблицу users (phone text, password text).
    3. Вставьте свой API URL и токен (если требуется) в переменные NOCODB_API_URL и NOCODB_API_TOKEN.
    4. Готово! Пользователи будут храниться в вашей базе NocoDB.
    5. В реальном проекте пароль нужно хранить в виде хэша!
    -->
</body>
</html>
