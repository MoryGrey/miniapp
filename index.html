<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium car rental</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', Arial, sans-serif;
      background: #191A1E;
      min-height: 100vh;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }
    .container {
      width: 100vw;
      max-width: 430px;
      min-height: 100vh;
      background: #191A1E;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    /* Задний фон-паттерн */
    .bg-pattern {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      background: url('data:image/svg+xml;utf8,<svg width="430" height="932" viewBox="0 0 430 932" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="430" height="932" fill="%23191A1E"/><path d="M0 0L430 932" stroke="%2339393F" stroke-width="40" opacity="0.15"/><path d="M430 0L0 932" stroke="%2339393F" stroke-width="40" opacity="0.15"/><path d="M215 0V932" stroke="%2339393F" stroke-width="20" opacity="0.08"/></svg>') center/cover no-repeat;
    }
    .header {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      padding: 32px 24px 0 24px;
      font-size: 16px;
      color: #fff;
      position: relative;
      z-index: 10;
    }
    .header .brand {
      color: #FFD600;
      font-weight: 900;
      letter-spacing: 1.5px;
      font-size: 22px;
      text-transform: uppercase;
      text-align: left;
      background: rgba(25, 26, 30, 0.85);
      padding: 6px 16px 6px 0;
      border-radius: 8px;
    }
    .header .skip {
      color: #fff;
      opacity: 0.7;
      font-size: 15px;
      font-weight: 400;
    }
    .dots {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 16px 0 0 0;
      gap: 6px;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #393A3F;
      opacity: 0.7;
    }
    .dot.active {
      background: #FFD600;
      opacity: 1;
    }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: flex-start;
      padding: 0 24px;
      margin-top: 16px;
    }
    .title {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 12px;
      line-height: 1.1;
    }
    .subtitle {
      font-size: 16px;
      color: #B0B0B0;
      font-weight: 400;
      margin-bottom: 24px;
      line-height: 1.4;
    }
    .car-image {
      width: 130%;
      max-width: 500px;
      margin: 0;
      display: block;
      position: relative;
      z-index: 2;
      margin-bottom: 24px;
      left: -18%;
      top: 52px;
      transition: transform 0.5s cubic-bezier(.7,0,.3,1);
    }
    .car-image.animate {
      transform: translateX(100vw) scale(0.8);
      transition: transform 1s ease-in-out;
    }
    
    .yellow-fill {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #FFD700, #FFA500);
      z-index: 9999;
      transform: translateY(100%);
      transition: transform 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      pointer-events: none;
      filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.6));
      border-radius: 50% 50% 0 0;
    }
    
    .yellow-fill.active {
      transform: translateY(0);
      border-radius: 0;
      filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.8));
    }
    .footer {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 0 24px 0;
      background: transparent;
      position: fixed;
      left: 0;
      bottom: 0;
      z-index: 20;
    }
    .get-started-btn {
      width: 100%;
      max-width: 350px;
      padding: 16px 0;
      background: #FFD600;
      color: #191A1E;
      font-size: 18px;
      font-weight: 700;
      border: none;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: background 0.2s;
    }
    .get-started-btn:active {
      background: #ffe066;
    }
    /* Анимированный жёлтый фон */
    .overlay {
      position: fixed;
      left: 50%;
      bottom: 24px;
      width: 100px;
      height: 100px;
      background: #FFD600;
      border-radius: 50%;
      z-index: 1000;
      transform: translate(-50%, 0) scale(0);
      transition: transform 0.7s cubic-bezier(.7,0,.3,1);
      pointer-events: none;
    }
    .overlay.active {
      transform: translate(-50%, 0) scale(20);
      transition: transform 0.7s cubic-bezier(.7,0,.3,1);
    }
    @media (max-width: 500px) {
      .container {
        max-width: 100vw;
      }
      .main {
        padding: 0 12px;
      }
      .footer {
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="bg-pattern"></div>
    <div class="overlay" id="overlay"></div>
    <div>
      <div class="header">
        <span class="brand">ТАКСИ ПРЕСТИЖ</span>
      </div>
      <div class="dots">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <div class="main">
        <div class="title">Premium<br>car rental</div>
        <div class="subtitle">Rent the car of your dreams<br>with home delivery</div>
        <img src="car.png" alt="Car" class="car-image">
      </div>
    </div>
    <div class="footer">
      <button class="get-started-btn" id="orderBtn">Заказать такси</button>
    </div>
  </div>
  <div class="yellow-fill" id="yellowFill"></div>
  <audio id="carSound" src="car.mp3" preload="auto"></audio>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const btn = document.getElementById('orderBtn');
      const overlay = document.getElementById('overlay');
      const car = document.querySelector('.car-image');
      const carSound = document.getElementById('carSound');
      const yellowFill = document.getElementById('yellowFill');
      
      console.log('Elements found:', {btn, overlay, car, carSound, yellowFill});
      
      if (btn) {
        btn.addEventListener('click', function() {
          console.log('Button clicked!');
          car.classList.add('animate');
          if (carSound) {
            carSound.currentTime = 0;
            carSound.play().catch(e => console.log('Audio play error:', e));
          }
          setTimeout(() => {
            if (yellowFill) {
              yellowFill.classList.add('active');
              console.log('Yellow fill activated');
            }
          }, 200);
          setTimeout(() => {
            if (overlay) {
              overlay.classList.add('active');
              console.log('Overlay activated');
            }
          }, 1200);
          setTimeout(() => {
            window.location.href = 'taxi.html';
          }, 1800);
        });
      } else {
        console.error('Button not found!');
      }
    });
  </script>
</body>
</html>
