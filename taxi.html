<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оформление заказа | Такси Престиж</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', Arial, sans-serif;
      background: #191A1E;
      min-height: 100vh;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }
    .container {
      width: 100vw;
      max-width: 430px;
      min-height: 100vh;
      background: #191A1E;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }
    .bg-pattern {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      background: url('data:image/svg+xml;utf8,<svg width="430" height="932" viewBox="0 0 430 932" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="430" height="932" fill="%23191A1E"/><path d="M0 0L430 932" stroke="%2339393F" stroke-width="40" opacity="0.15"/><path d="M430 0L0 932" stroke="%2339393F" stroke-width="40" opacity="0.15"/><path d="M215 0V932" stroke="%2339393F" stroke-width="20" opacity="0.08"/></svg>') center/cover no-repeat;
    }
    .header {
      display: flex;
      align-items: center;
      padding: 32px 24px 0 24px;
      font-size: 16px;
      color: #fff;
      position: relative;
      z-index: 10;
    }
    .header .brand {
      color: #FFD600;
      font-weight: 900;
      letter-spacing: 1.5px;
      font-size: 22px;
      text-transform: uppercase;
      text-align: left;
      background: rgba(25, 26, 30, 0.85);
      padding: 6px 16px 6px 0;
      border-radius: 8px;
    }
    .order-title {
      font-size: 26px;
      font-weight: 700;
      margin: 24px 0 12px 24px;
      letter-spacing: 0.5px;
      z-index: 2;
      position: relative;
    }
    .map-container {
      width: 100vw;
      max-width: 430px;
      height: 68vh;
      min-height: 320px;
      margin: 0 auto 0 auto;
      border-radius: 0 0 32px 32px;
      overflow: hidden;
      box-shadow: 0 4px 32px rgba(0,0,0,0.18);
      position: relative;
      z-index: 2;
      background: #23242a;
      animation: fadeIn 1s cubic-bezier(.7,0,.3,1);
      touch-action: none;
    }
    .map-iframe {
      width: 100%;
      height: 100%;
      border: none;
      filter: grayscale(0.2) brightness(0.95) contrast(1.1);
      transition: filter 0.3s;
    }
    .map-marker {
      position: absolute;
      width: 32px;
      height: 32px;
      background: #FFD600;
      border-radius: 50%;
      border: 3px solid #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
      left: 50%;
      top: 60%;
      transform: translate(-50%, -50%);
      z-index: 3;
      animation: markerPop 0.7s cubic-bezier(.7,0,.3,1);
      transition: left 0.4s cubic-bezier(.7,0,.3,1), top 0.4s cubic-bezier(.7,0,.3,1);
      cursor: pointer;
    }
    .map-marker.to {
      left: 75%;
      top: 30%;
      background: #FF7A00;
      animation-delay: 0.2s;
    }
    .map-path {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      overflow: visible;
    }
    /* Анимация прорисовки маршрута */
    .route-animate {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: dashRoute 0.7s cubic-bezier(.7,0,.3,1) forwards;
    }
    @keyframes dashRoute {
      to { stroke-dashoffset: 0; }
    }
    @keyframes markerPop {
      0% { transform: scale(0.2) translate(-50%, -50%); opacity: 0; }
      80% { transform: scale(1.15) translate(-50%, -50%); opacity: 1; }
      100% { transform: scale(1) translate(-50%, -50%); opacity: 1; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .order-panel {
      width: 100%;
      max-width: 430px;
      background: rgba(25,26,30,0.98);
      border-radius: 24px 24px 0 0;
      box-shadow: 0 -2px 24px rgba(0,0,0,0.12);
      padding: 24px 16px 100px 16px;
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%) translateY(60px);
      z-index: 20;
      animation: slideUpFade 1.1s cubic-bezier(.7,0,.3,1);
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      animation-fill-mode: forwards;
    }
    @keyframes slideUpFade {
      0% { opacity: 0; transform: translateX(-50%) translateY(60px); }
      80% { opacity: 1; }
      100% { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    .order-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .order-btn {
      flex: 1;
      margin: 0 6px;
      padding: 14px 0;
      background: #23242a;
      color: #FFD600;
      font-size: 17px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      outline: none;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .order-btn.active, .order-btn:active {
      background: #FFD600;
      color: #191A1E;
    }
    .geo-btn {
      background: none;
      border: none;
      color: #FFD600;
      font-size: 20px;
      margin-left: 8px;
      cursor: pointer;
      transition: color 0.2s;
    }
    .geo-btn:active {
      color: #FF7A00;
    }
    .price-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 18px;
      font-weight: 700;
      color: #FFD600;
    }
    .child-seat-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      font-size: 16px;
      color: #fff;
    }
    .child-seat-switch {
      width: 48px;
      height: 28px;
      background: #23242a;
      border-radius: 14px;
      position: relative;
      cursor: pointer;
      transition: background 0.2s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.10);
    }
    .child-seat-switch.active {
      background: #FFD600;
    }
    .child-seat-knob {
      position: absolute;
      top: 3px;
      left: 4px;
      width: 22px;
      height: 22px;
      background: #fff;
      border-radius: 50%;
      transition: left 0.2s;
    }
    .child-seat-switch.active .child-seat-knob {
      left: 22px;
      background: #191A1E;
    }
    .order-final {
      width: 100%;
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .order-final-btn {
      width: 100%;
      max-width: 350px;
      padding: 16px 0;
      background: #FFD600;
      color: #191A1E;
      font-size: 18px;
      font-weight: 700;
      border: none;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: background 0.2s;
    }
    .order-final-btn:active {
      background: #ffe066;
    }
    .map-3d-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #191A1E 60%, #23242a 100%);
    }
    .map-siri-sphere {
      width: 170px;
      height: 170px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      transition: box-shadow 0.7s, filter 0.7s, transform 1.2s cubic-bezier(.7,0,.3,1), width 1.2s cubic-bezier(.7,0,.3,1), height 1.2s cubic-bezier(.7,0,.3,1);
      z-index: 10;
    }
    /* grow-анимация сферы удалена */
    .map-siri-glow {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: radial-gradient(circle at 60% 40%, #FFD600 0%, #FFD60044 60%, #23242a 100%);
      filter: blur(12px) brightness(1.1);
      transform: translate(-50%, -50%);
      z-index: 1;
      animation: siri-glow 2.5s infinite alternate;
    }
    .map-siri-wave {
      width: 120px;
      height: 120px;
      position: relative;
      z-index: 2;
      filter: drop-shadow(0 4px 24px #FFD60044);
    }
    #siriWave {
      stroke: #fff;
      stroke-width: 3;
      filter: drop-shadow(0 0 8px #FFD60088);
      animation: siri-wave 2s infinite ease-in-out;
    }
    @keyframes siri-glow {
      0% { filter: blur(12px) brightness(1.1); }
      100% { filter: blur(20px) brightness(1.25); }
    }
    @keyframes siri-wave {
      0%,100% { d: path('M20,60 Q40,40 60,60 T100,60'); }
      25% { d: path('M20,60 Q40,80 60,60 T100,60'); }
      50% { d: path('M20,60 Q40,30 60,60 T100,60'); }
      75% { d: path('M20,60 Q40,90 60,60 T100,60'); }
    }
    .map-siri-caption {
      font-family: 'Inter', Arial, sans-serif;
      font-weight: 900;
      font-size: 1.6rem;
      letter-spacing: 2.5px;
      text-align: center;
      margin-top: 18px;
      margin-bottom: 0;
      user-select: none;
      background: linear-gradient(90deg, #FFD600 20%, #FFB800 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-fill-color: transparent;
      filter: drop-shadow(0 2px 12px #FFD60088) drop-shadow(0 1px 0 #23242a);
      animation: fadeInText 1.2s cubic-bezier(.7,0,.3,1);
    }
    @keyframes fadeInText {
      from { opacity: 0; transform: translateY(20px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @media (max-width: 500px) {
      .map-siri-sphere, .map-siri-glow {
        width: 100px;
        height: 100px;
      }
      .map-siri-wave {
        width: 70px;
        height: 70px;
      }
      .map-siri-caption {
        font-size: 1.05rem;
        letter-spacing: 1.2px;
      }
    }
    .order-row-vertical {
      flex-direction: column;
      gap: 14px;
      align-items: stretch;
    }
    .order-input {
      width: 100%;
      padding: 14px 16px;
      font-size: 17px;
      border-radius: 12px;
      border: none;
      background: #23242a;
      color: #FFD600;
      font-family: 'Inter', Arial, sans-serif;
      font-weight: 700;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      outline: none;
      margin-bottom: 0;
      transition: background 0.2s, color 0.2s;
    }
    .order-input:focus {
      background: #FFD600;
      color: #191A1E;
    }
    @media (max-width: 500px) {
      .container {
        max-width: 100vw;
      }
      .order-panel {
        max-width: 100vw;
        padding: 18px 4px 90px 4px;
      }
      .map-container {
        max-width: 100vw;
        height: 68vh;
        min-height: 220px;
      }
      .map-3d-cube, .map-3d-face {
        width: 120px;
        height: 120px;
        font-size: 1.1rem;
      }
    }
    .order-overlay {
      position: fixed;
      left: 0; top: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.92);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .order-overlay.active {
      opacity: 1;
      pointer-events: all;
    }
    .falling-spotlight {
      width: 220px;
      height: 320px;
      position: relative;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }
    .spotlight-beam {
      position: absolute;
      left: 50%;
      top: 0;
      width: 120px;
      height: 320px;
      transform: translateX(-50%);
      background: radial-gradient(ellipse at 50% 0%, #fff7 0%, #FFD60044 60%, #FFD60000 100%);
      filter: blur(2px);
      z-index: 1;
      animation: beam-fade 1.2s linear forwards;
    }
    @keyframes beam-fade {
      0% { opacity: 1; }
      80% { opacity: 1; }
      100% { opacity: 0.2; }
    }
    .falling-human {
      position: absolute;
      left: 50%;
      top: 40px;
      width: 54px;
      height: 54px;
      transform: translateX(-50%) scale(1);
      z-index: 2;
      opacity: 0;
      animation: human-fall 1.1s cubic-bezier(.7,0,.3,1) forwards;
    }
    @keyframes human-fall {
      0% { top: 0; opacity: 0; transform: translateX(-50%) scale(0.7) rotate(-20deg); }
      20% { opacity: 1; }
      80% { top: 180px; opacity: 1; transform: translateX(-50%) scale(1.1) rotate(10deg); }
      100% { top: 220px; opacity: 0; transform: translateX(-50%) scale(0.9) rotate(0deg); }
    }
    /* .yellow-fill удалён, заливка теперь только через .map-siri-sphere */
    .map-siri-sphere {
      width: 170px;
      height: 170px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      transition: box-shadow 0.7s, filter 0.7s, transform 1.2s cubic-bezier(.7,0,.3,1), width 1.2s cubic-bezier(.7,0,.3,1), height 1.2s cubic-bezier(.7,0,.3,1);
      z-index: 10;
    }
    .yellow-fill {
      position: fixed;
      left: 0; bottom: 0;
      width: 100vw;
      height: 0;
      background: linear-gradient(0deg, #FFD600 80%, #FFD600cc 100%);
      border-radius: 0 0 48vw 48vw / 0 0 16vw 16vw;
      z-index: 10000;
      pointer-events: none;
      transition: height 1.2s cubic-bezier(.7,0,.3,1);
    }
    .yellow-fill.active {
      height: 100vh;
      transition: height 1.2s cubic-bezier(.7,0,.3,1);
    }
    .order-success-box {
      position: fixed;
      left: 50%; top: 50%;
      transform: translate(-50%,-50%) scale(0.8);
      background: #191A1E;
      border: 3px solid #FFD600;
      border-radius: 24px;
      box-shadow: 0 8px 32px #FFD60044, 0 2px 12px #0008;
      padding: 38px 28px 32px 28px;
      min-width: 260px;
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      z-index: 10001;
      transition: opacity 0.7s cubic-bezier(.7,0,.3,1), transform 0.7s cubic-bezier(.7,0,.3,1);
    }
    .order-success-box.active {
      opacity: 1;
      transform: translate(-50%,-50%) scale(1);
      transition-delay: 1.2s;
    }
    .order-locator {
      width: 54px;
      height: 54px;
      margin-bottom: 18px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .order-locator-pulse {
      position: absolute;
      left: 50%; top: 50%;
      width: 54px; height: 54px;
      background: radial-gradient(circle, #FFD60055 0%, #FFD60000 80%);
      border-radius: 50%;
      transform: translate(-50%,-50%);
      animation: locator-pulse 1.2s infinite;
      z-index: 1;
    }
    @keyframes locator-pulse {
      0% { opacity: 0.7; transform: translate(-50%,-50%) scale(1); }
      70% { opacity: 0.2; transform: translate(-50%,-50%) scale(1.7); }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(2); }
    }
    .order-locator-dot {
      width: 18px; height: 18px;
      background: #FFD600;
      border-radius: 50%;
      border: 3px solid #fff;
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%,-50%);
      z-index: 2;
      box-shadow: 0 2px 8px #FFD60088;
    }
    .order-success-text {
      color: #FFD600;
      font-size: 1.25rem;
      font-family: 'Inter', Arial, sans-serif;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-align: center;
      margin-top: 8px;
      text-shadow: 0 2px 8px #23242a, 0 1px 0 #fff8;
      animation: fadeInText 1.2s 2.1s cubic-bezier(.7,0,.3,1) both;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="bg-pattern"></div>
    <div class="header">
      <span class="brand">ТАКСИ ПРЕСТИЖ</span>
    </div>
    <div class="order-title">Оформление заказа</div>
    <div class="map-3d-placeholder" style="margin-top: 24px; margin-bottom: 18px;">
      <div class="map-siri-sphere">
        <div class="map-siri-glow"></div>
        <svg class="map-siri-wave" viewBox="0 0 120 120">
          <defs>
            <radialGradient id="siriYellow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#FFD600" stop-opacity="1"/>
              <stop offset="80%" stop-color="#FFD600" stop-opacity="0.5"/>
              <stop offset="100%" stop-color="#23242a" stop-opacity="0.2"/>
            </radialGradient>
          </defs>
          <ellipse cx="60" cy="60" rx="48" ry="48" fill="url(#siriYellow)"/>
          <path id="siriWave" d="M20,60 Q40,40 60,60 T100,60" stroke="#fff" stroke-width="3" fill="none"/>
        </svg>
      </div>
      <div class="map-siri-caption">КАРТА В РАЗРАБОТКЕ</div>
    </div>
    <div class="order-panel">
      <div class="order-row order-row-vertical">
        <input class="order-input" id="fromInput" placeholder="Откуда" autocomplete="off" />
        <input class="order-input" id="toInput" placeholder="Куда" autocomplete="off" />
      </div>
      <div class="price-row">
        <span>Цена:</span>
        <span id="price">150 ₽</span>
      </div>
      <div class="child-seat-row">
        <span>Детское кресло +50 ₽</span>
        <div class="child-seat-switch" id="childSeatSwitch">
          <div class="child-seat-knob"></div>
        </div>
      </div>
      <div class="order-final">
        <button class="order-final-btn" id="orderFinalBtn">Заказать</button>
      </div>
    </div>
  </div>
  <div class="order-overlay" id="orderOverlay">
    <div class="falling-spotlight">
      <div class="spotlight-beam"></div>
      <svg class="falling-human" viewBox="0 0 54 54">
        <g>
          <circle cx="27" cy="10" r="6" fill="#191A1E"/>
          <rect x="23" y="16" width="8" height="18" rx="4" fill="#191A1E"/>
          <rect x="19" y="22" width="6" height="18" rx="3" fill="#191A1E" transform="rotate(-30 22 31)"/>
          <rect x="29" y="22" width="6" height="18" rx="3" fill="#191A1E" transform="rotate(30 32 31)"/>
        </g>
      </svg>
    </div>
    <div class="yellow-fill"></div>
    <div class="order-success-box">
      <div class="order-locator">
        <div class="order-locator-pulse"></div>
        <div class="order-locator-dot"></div>
      </div>
      <div class="order-success-text">Заказ принят.<br>Ожидайте!</div>
    </div>
  </div>
  <audio id="zakazSound" src="zakaz.mp3" preload="auto"></audio>
  <script>
    // Детское кресло
    const childSeatSwitch = document.getElementById('childSeatSwitch');
    const priceEl = document.getElementById('price');
    let childSeat = false;
    childSeatSwitch.addEventListener('click', () => {
      childSeat = !childSeat;
      childSeatSwitch.classList.toggle('active', childSeat);
      priceEl.textContent = childSeat ? '200 ₽' : '150 ₽';
    });

    // Анимация кнопок
    document.querySelectorAll('.order-btn, .order-final-btn').forEach(btn => {
      btn.addEventListener('mousedown', e => btn.classList.add('active'));
      btn.addEventListener('mouseup', e => btn.classList.remove('active'));
      btn.addEventListener('mouseleave', e => btn.classList.remove('active'));
    });

    // --- Анимация оформления заказа и валидация ---
    const orderOverlay = document.getElementById('orderOverlay');
    const orderBtn = document.getElementById('orderFinalBtn');
    const fromInput = document.getElementById('fromInput');
    const toInput = document.getElementById('toInput');

    function showInputError(input) {
      input.classList.add('input-error');
      setTimeout(() => input.classList.remove('input-error'), 1200);
    }

    orderBtn.addEventListener('click', (e) => {
      e.preventDefault();
      const fromVal = fromInput.value.trim();
      const toVal = toInput.value.trim();
      if (!fromVal || !toVal) {
        if (!fromVal) showInputError(fromInput);
        if (!toVal) showInputError(toInput);
        if (!document.getElementById('inputErrorMsg')) {
          const msg = document.createElement('div');
          msg.id = 'inputErrorMsg';
          msg.textContent = 'Введите адрес';
          msg.style.cssText = 'color:#FFD600;font-weight:700;text-align:center;margin-top:8px;font-size:1.1rem;animation:fadeInText 0.7s;';
          orderBtn.parentNode.appendChild(msg);
          setTimeout(()=>{ if(msg) msg.remove(); }, 1800);
        }
        return;
      }
      orderOverlay.classList.add('active');
      const successBox = document.querySelector('.order-success-box');
      const yellowFill = document.querySelector('.yellow-fill');
      successBox.classList.remove('active');
      yellowFill.classList.remove('active');
      setTimeout(() => {
        yellowFill.classList.add('active');
      }, 400); // после падения силуэта
      setTimeout(() => {
        successBox.classList.add('active');
        // Воспроизводим звук при появлении рамки "Заказ принят"
        const zakazSound = document.getElementById('zakazSound');
        if (zakazSound) {
          zakazSound.currentTime = 0;
          zakazSound.play().catch(e => console.log('Audio play error:', e));
        }
        
        // Отправляем заказ в группу водителей
        const orderId = Date.now().toString().slice(-6); // Генерируем ID заказа
        const orderData = {
          from: fromVal,
          to: toVal,
          price: childSeat ? '200 ₽' : '150 ₽',
          childSeat: childSeat,
          orderId: orderId
        };
        
        fetch('http://localhost:3000/new-order', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(orderData)
        })
        .then(response => response.json())
        .then(data => {
          console.log('Заказ отправлен:', data);
        })
        .catch(error => {
          console.error('Ошибка отправки заказа:', error);
        });
      }, 800); // быстрее после заливки
    });

    // Стили для ошибки
    const style = document.createElement('style');
    style.innerHTML = `.input-error { background: #FFD600 !important; color: #191A1E !important; box-shadow: 0 0 0 2px #FFD600, 0 2px 12px rgba(0,0,0,0.08); }`;
    document.head.appendChild(style);
  </script>
</body>
</html>
