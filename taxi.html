<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Такси Престиж | Заказ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;500;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      background: #191A1E;
      font-family: 'Montserrat', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: stretch;
      height: 100vh;
    }
    .map-placeholder {
      width: 100vw;
      background: #232323;
      border-radius: 0 0 18px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 0 16px 0;
      box-shadow: 0 2px 12px rgba(0,0,0,0.10);
      position: fixed;
      top: 0;
      left: 0;
      z-index: 10;
      min-height: 80px;
      max-height: 90px;
    }
    .map-icon {
      font-size: 2.1rem;
      color: #FFD600;
      margin-bottom: 6px;
      animation: mapWiggle 2s infinite alternate;
    }
    @keyframes mapWiggle {
      0% { transform: rotate(-7deg) scale(1); }
      100% { transform: rotate(7deg) scale(1.08); }
    }
    .map-caption {
      color: #FFD600;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-align: center;
      margin-bottom: 0;
    }
    .container {
      width: 100vw;
      min-height: 100vh;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: stretch;
      padding-bottom: 90px;
      padding-top: 90px;
      flex: 1 1 auto;
    }
    .order-form {
      background: #232323;
      border-radius: 0;
      box-shadow: none;
      padding: 0 0 24px 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 18px;
      align-items: stretch;
      height: 100%;
      justify-content: center;
      flex: 1 1 auto;
    }
    .order-input {
      padding: 18px 8px;
      font-size: 1.25rem;
      border-radius: 0;
      border: 2px solid #FFD600;
      background: #191A1E;
      color: #fff;
      outline: none;
      margin-bottom: 0;
      transition: border 0.2s;
      font-family: 'Montserrat', Arial, sans-serif;
      width: 100vw;
      box-sizing: border-box;
    }
    .order-input:focus {
      border-color: #FFC400;
    }
    .order-btn {
      width: 100vw;
      border-radius: 0;
      margin-left: 0;
      margin-right: 0;
      font-size: 1.2rem;
      font-weight: 700;
      padding: 18px 0;
      background: linear-gradient(90deg, #FFD600 60%, #FFC400 100%);
      color: #191A1E;
      border: none;
      box-shadow: 0 2px 12px rgba(255,214,0,0.10);
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      letter-spacing: 1px;
      position: relative;
      overflow: hidden;
      max-width: 100vw;
    }
    .order-btn:active {
      background: #ffe066;
      transform: scale(0.97);
    }
    /* Bottom Navigation Bar */
    .bottom-bar {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100vw;
      background: #232323;
      box-shadow: 0 -2px 16px rgba(0,0,0,0.18);
      display: flex;
      justify-content: space-around;
      align-items: center;
      height: 74px;
      z-index: 2000;
      border-radius: 18px 18px 0 0;
    }
    .bar-item {
      flex: 1;
      text-align: center;
      color: #FFD600;
      font-size: 1.5rem;
      transition: color 0.2s;
      position: relative;
      cursor: pointer;
      padding: 0 0 6px 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .bar-item.active {
      color: #191A1E;
    }
    .bar-center {
      position: relative;
      top: -22px;
      background: linear-gradient(90deg, #FFD600 60%, #FFC400 100%);
      color: #191A1E;
      border-radius: 50%;
      width: 68px;
      height: 68px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      box-shadow: 0 4px 24px rgba(255,214,0,0.18);
      border: 4px solid #232323;
      transition: box-shadow 0.3s, transform 0.2s, background 0.2s, color 0.2s;
      z-index: 3;
      cursor: pointer;
      animation: popIn 0.7s cubic-bezier(.7,0,.3,1);
    }
    .bar-center.inactive {
      background: #232323;
      color: #FFD600;
      border: 4px solid #FFD600;
      box-shadow: none;
    }
    .bar-center:active {
      box-shadow: 0 0 0 12px rgba(255,214,0,0.10);
      transform: scale(1.08);
      animation: bounce 0.4s;
    }
    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes bounce {
      0% { transform: scale(1); }
      40% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
    .bar-label {
      font-size: 0.75rem;
      color: #FFD600;
      margin-top: 2px;
      font-weight: 500;
      letter-spacing: 0.5px;
      transition: color 0.2s;
      line-height: 1;
      text-align: center;
      white-space: nowrap;
    }
    .bar-item.active .bar-label {
      color: #191A1E;
      font-weight: 700;
    }
    .bar-center .bar-label {
      color: #191A1E;
      font-size: 0.85rem;
      font-weight: 700;
      margin-top: 2px;
      line-height: 1;
      text-align: center;
      white-space: nowrap;
    }
    .bar-center.inactive .bar-label {
      color: #FFD600;
    }
    .order-options {
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin-bottom: 8px;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }
    .toggle-label {
      display: flex;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }
    .toggle-input {
      display: none;
    }
    .toggle-slider {
      width: 44px;
      height: 24px;
      background: #393939;
      border-radius: 12px;
      position: relative;
      margin-right: 12px;
      transition: background 0.2s;
      box-shadow: 0 1px 4px #0002;
    }
    .toggle-slider::before {
      content: '';
      position: absolute;
      left: 3px;
      top: 3px;
      width: 18px;
      height: 18px;
      background: #FFD600;
      border-radius: 50%;
      transition: left 0.2s, background 0.2s;
    }
    .toggle-input:checked + .toggle-slider {
      background: #FFD600;
    }
    .toggle-input:checked + .toggle-slider::before {
      left: 23px;
      background: #191A1E;
    }
    .toggle-text {
      color: #FFD600;
      font-size: 1.08rem;
      font-weight: 600;
      margin-left: 2px;
    }
    .city-type-row {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .city-type-btn {
      flex: 1;
      padding: 12px 0;
      background: #232323;
      color: #FFD600;
      border: 2px solid #FFD600;
      border-radius: 10px;
      font-size: 1.08rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border 0.2s;
    }
    .city-type-btn.active {
      background: linear-gradient(90deg, #FFD600 60%, #FFC400 100%);
      color: #191A1E;
      border: 2px solid #FFD600;
    }
    .city-type-btn:active {
      background: #ffe066;
    }
    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #FFD600;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .out-price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #FFD600;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    @media (max-width: 500px) {
      .container { max-width: 100vw; }
      .order-form { max-width: 100vw; min-height: 70vh; justify-content: center; padding-left: 0; padding-right: 0; }
      .map-placeholder { max-width: 100vw; }
      .order-btn { max-width: 100vw; border-radius: 0; margin-left: 0; margin-right: 0; }
      .order-input { font-size: 1.25rem; padding: 18px 16px; max-width: 100vw; border-radius: 0; margin-left: 0; margin-right: 0; }
    }
    .order-success-overlay {
      position: fixed;
      left: 0; top: 0; width: 100vw; height: 100vh;
      background: rgba(25,26,30,0.97);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.7s;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .order-success-box {
      background: #232323;
      border-radius: 18px;
      box-shadow: 0 8px 32px #FFD60044, 0 2px 12px #0008;
      padding: 38px 28px 32px 28px;
      min-width: 260px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: popIn 0.7s cubic-bezier(.7,0,.3,1);
    }
    .order-success-icon {
      font-size: 3.2rem;
      color: #FFD600;
      margin-bottom: 18px;
      animation: bounce 1.2s;
    }
    .order-success-title {
      color: #FFD600;
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 8px;
      text-align: center;
    }
    .order-success-desc {
      color: #fff;
      font-size: 1.05rem;
      text-align: center;
    }
    .history-panel {
      position: fixed;
      left: 0; top: 0; width: 100vw;
      background: #191A1E;
      z-index: 900;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      padding-top: 90px;
      padding-bottom: 90px;
      height: calc(100vh - 74px);
      box-sizing: border-box;
    }
    /* Профиль */
    #profilePanel {
      position: fixed;
      left: 0; top: 0; width: 100vw;
      background: #191A1E;
      z-index: 900;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-bottom: 90px;
      height: calc(100vh - 74px);
      box-sizing: border-box;
    }
    .history-tabs {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .history-tab {
      flex: 1;
      padding: 12px 0;
      background: #232323;
      color: #FFD600;
      border: 2px solid #FFD600;
      border-radius: 10px;
      font-size: 1.08rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border 0.2s;
    }
    .history-tab.active {
      background: linear-gradient(90deg, #FFD600 60%, #FFC400 100%);
      color: #191A1E;
      border: 2px solid #FFD600;
    }
    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 12px;
    }
    .history-item {
      background: #232323;
      border-radius: 12px;
      margin-bottom: 14px;
      padding: 16px 14px 12px 14px;
      color: #fff;
      box-shadow: 0 2px 8px #0002;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
    }
    .history-status {
      font-size: 0.98rem;
      font-weight: 700;
      color: #FFD600;
      margin-bottom: 2px;
    }
    .history-actions {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }
    .history-action-btn {
      background: #FFD600;
      color: #191A1E;
      border: none;
      border-radius: 8px;
      padding: 7px 14px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.98rem;
      transition: background 0.2s;
    }
    .history-action-btn:active {
      background: #FFC400;
    }
    .bar-item {
      position: relative;
    }
    .bar-circle {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(0);
      width: 56px;
      height: 56px;
      background: linear-gradient(90deg, #FFD600 60%, #FFC400 100%);
      border-radius: 50%;
      z-index: 1;
      transition: transform 0.25s cubic-bezier(.7,0,.3,1), box-shadow 0.2s;
      box-shadow: 0 4px 24px rgba(255,214,0,0.18);
      pointer-events: none;
    }
    .bar-item.active .bar-circle {
      transform: translate(-50%, -50%) scale(1);
      box-shadow: 0 4px 24px rgba(255,214,0,0.28);
    }
    .bar-item .fa-solid {
      position: relative;
      z-index: 2;
    }
    .bar-item .bar-label {
      position: relative;
      z-index: 2;
    }
    .profile-card {
      background: #232323;
      border-radius: 22px;
      box-shadow: 0 8px 32px #FFD60022, 0 2px 12px #0008;
      padding: 38px 28px 32px 28px;
      min-width: 260px;
      max-width: 340px;
      width: 90vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: popIn 0.7s cubic-bezier(.7,0,.3,1);
    }
    .profile-avatar {
      font-size: 3.2rem;
      color: #FFD600;
      background: #191A1E;
      border-radius: 50%;
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      box-shadow: 0 2px 12px #FFD60022;
    }
    .profile-phone {
      color: #FFD600;
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 12px;
      text-align: center;
    }
    .profile-stats {
      display: flex;
      gap: 24px;
      margin-bottom: 18px;
      justify-content: center;
    }
    .profile-stat {
      color: #fff;
      font-size: 1.05rem;
      text-align: center;
    }
    .profile-logout {
      background: #FFD600;
      color: #191A1E;
      border: none;
      border-radius: 12px;
      padding: 12px 32px;
      font-weight: 700;
      font-size: 1.08rem;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }
    .profile-logout:active {
      background: #FFC400;
    }
    .profile-name {
      color: #fff;
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 6px;
      text-align: center;
    }
    .profile-name-edit {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 6px;
      justify-content: center;
    }
    .profile-name-input {
      font-size: 1.08rem;
      padding: 7px 12px;
      border-radius: 8px;
      border: 2px solid #FFD600;
      background: #191A1E;
      color: #fff;
      font-weight: 600;
      width: 120px;
      outline: none;
      transition: border 0.2s;
    }
    .profile-name-input:focus {
      border-color: #FFC400;
    }
    .profile-save-btn {
      background: #FFD600;
      color: #191A1E;
      border: none;
      border-radius: 8px;
      padding: 7px 16px;
      font-weight: 700;
      font-size: 1.08rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .profile-save-btn:active {
      background: #FFC400;
    }
    .profile-save-anim {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      justify-content: center;
      opacity: 0;
      animation: none;
      color: #43d96b;
      font-weight: 700;
      font-size: 1.08rem;
      transition: opacity 0.3s;
    }
    .profile-save-anim.active {
      opacity: 1;
      animation: fadeInOut 1.5s;
    }
    .profile-save-icon {
      font-size: 1.3rem;
      color: #43d96b;
    }
    @keyframes fadeInOut {
      0% { opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { opacity: 0; }
    }
    .profile-name-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      justify-content: center;
    }
    .profile-name-text {
      color: #fff;
      font-size: 1.15rem;
      font-weight: 600;
      text-align: center;
      min-width: 60px;
    }
    .profile-edit-btn {
      background: none;
      border: none;
      color: #FFD600;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 50%;
      transition: background 0.2s;
    }
    .profile-edit-btn:active {
      background: #FFD60022;
    }
    .profile-promo-block {
      width: 100%;
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .profile-promo-btn {
      background: linear-gradient(90deg, #FFD600 60%, #FFC400 100%);
      color: #191A1E;
      border: none;
      border-radius: 12px;
      padding: 12px 32px;
      font-weight: 700;
      font-size: 1.08rem;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 0;
    }
    .profile-promo-btn:active {
      background: #FFC400;
    }
    .profile-promo-form {
      display: flex;
      gap: 8px;
      margin-top: 4px;
      align-items: center;
      justify-content: center;
    }
    .profile-promo-input {
      font-size: 1.08rem;
      padding: 7px 12px;
      border-radius: 8px;
      border: 2px solid #FFD600;
      background: #191A1E;
      color: #fff;
      font-weight: 600;
      width: 120px;
      outline: none;
      transition: border 0.2s;
    }
    .profile-promo-input:focus {
      border-color: #FFC400;
    }
    .profile-promo-activate {
      background: #FFD600;
      color: #191A1E;
      border: none;
      border-radius: 8px;
      padding: 7px 16px;
      font-weight: 700;
      font-size: 1.08rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .profile-promo-activate:active {
      background: #FFC400;
    }
    .profile-promo-anim {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
      justify-content: center;
      opacity: 0;
      animation: none;
      color: #43d96b;
      font-weight: 700;
      font-size: 1.08rem;
      transition: opacity 0.3s;
    }
    .profile-promo-anim.active {
      opacity: 1;
      animation: fadeInOut 1.5s;
    }
    .profile-promo-icon {
      font-size: 1.3rem;
      color: #43d96b;
    }
    .profile-promo-error {
      color: #ff5252;
      font-size: 1.02rem;
      margin-top: 2px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="map-placeholder">
    <span class="map-icon"><i class="fa-solid fa-map-location-dot"></i></span>
    <div class="map-caption">Карта в разработке</div>
  </div>
  <div class="container">
    <form class="order-form" id="orderForm">
      <div id="cityFields">
        <input class="order-input" id="fromInput" placeholder="Откуда" autocomplete="off" required />
        <input class="order-input" id="toInput" placeholder="Куда" autocomplete="off" required />
      </div>
      <div id="outFields" style="display:none;">
        <input class="order-input" id="villageInput" placeholder="Город или село" autocomplete="off" />
        <input class="order-input" id="streetInput" placeholder="Улица" autocomplete="off" />
        <input class="order-input" id="houseInput" placeholder="Дом" autocomplete="off" />
        <input class="order-input" id="phoneInput" placeholder="Номер телефона" autocomplete="off" />
        <input class="order-input" id="outToInput" placeholder="Куда ехать" autocomplete="off" />
      </div>
      <div class="order-options">
        <div class="toggle-row">
          <label class="toggle-label">
            <input type="checkbox" id="childSeatToggle" class="toggle-input">
            <span class="toggle-slider"></span>
            <span class="toggle-text">Детское кресло</span>
          </label>
        </div>
        <div class="city-type-row">
          <button type="button" class="city-type-btn active" id="cityBtn">По городу</button>
          <button type="button" class="city-type-btn" id="outBtn">Загород</button>
        </div>
      </div>
      <div class="price-row" id="priceRow">
        <span>Цена:</span>
        <span id="priceValue">150 ₽</span>
      </div>
      <div class="out-price-row" id="outPriceRow" style="display:none; color:#FFD600; font-weight:700; text-align:center; font-size:1.1rem; margin-bottom:8px;">Цена: <span id="outPriceValue">уточняйте у администрации</span></div>
      <button type="submit" class="order-btn">Заказать</button>
    </form>
  </div>
  <nav class="bottom-bar">
    <div class="bar-item" id="profileBtn">
      <span class="bar-circle" id="profileCircle"></span>
      <i class="fa-solid fa-user"></i>
      <div class="bar-label">Профиль</div>
    </div>
    <div class="bar-item" id="orderBtn">
      <span class="bar-circle" id="orderCircle"></span>
      <i class="fa-solid fa-taxi"></i>
      <div class="bar-label">Заказ</div>
    </div>
    <div class="bar-item" id="historyBtn">
      <span class="bar-circle" id="historyCircle"></span>
      <i class="fa-solid fa-clock-rotate-left"></i>
      <div class="bar-label">История</div>
    </div>
  </nav>
  <div class="order-success-overlay" id="orderSuccessOverlay" style="display:none;">
    <div class="order-success-box">
      <div class="order-success-icon"><i class="fa-solid fa-check-circle"></i></div>
      <div class="order-success-title">Заказ создан!</div>
      <div class="order-success-desc">Ожидайте подтверждения водителя</div>
    </div>
  </div>
  <div class="history-panel" id="historyPanel" style="display:none;">
    <div class="history-tabs">
      <button class="history-tab active" id="tabInProgress">В процессе</button>
      <button class="history-tab" id="tabDone">Выполненные</button>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>
  <!-- Профиль (в самом конце body, вне .container) -->
  <div id="profilePanel" style="display:none;">
    <div class="profile-card">
      <div class="profile-avatar"><i class="fa-solid fa-user"></i></div>
      <div class="profile-name-row">
        <span class="profile-name-text" id="profileNameText"></span>
        <button class="profile-edit-btn" id="profileEditBtn" title="Изменить имя"><i class="fa-solid fa-gear"></i></button>
      </div>
      <div class="profile-name-edit" id="profileNameEditBlock" style="display:none;">
        <input type="text" id="profileNameInput" class="profile-name-input" placeholder="Имя" />
        <button class="profile-save-btn" id="profileSaveBtn">Сохранить</button>
      </div>
      <div class="profile-save-anim" id="profileSaveAnim" style="display:none;">
        <span class="profile-save-icon"><i class="fa-solid fa-circle-check"></i></span>
        <span class="profile-save-text">Сохранено!</span>
      </div>
      <div class="profile-phone" id="profilePhone"></div>
      <div class="profile-stats">
        <div class="profile-stat"><span id="profileTrips">0</span><br>поездок</div>
      </div>
      <div class="profile-promo-block">
        <button class="profile-promo-btn" id="profilePromoBtn">Промокод</button>
        <div class="profile-promo-form" id="profilePromoForm" style="display:none;">
          <input type="text" id="promoInput" class="profile-promo-input" placeholder="Введите промокод" />
          <button class="profile-promo-activate" id="promoActivateBtn">Активировать</button>
        </div>
        <div class="profile-promo-anim" id="profilePromoAnim" style="display:none;">
          <span class="profile-promo-icon"><i class="fa-solid fa-gift"></i></span>
          <span class="profile-promo-text">Промокод активирован! -50₽</span>
        </div>
        <div class="profile-promo-error" id="profilePromoError" style="display:none;"></div>
      </div>
      <button class="profile-logout" id="logoutBtn">Выйти</button>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script>
    if (!localStorage.getItem('phone')) {
      window.location.href = 'index.html';
    }
    const firebaseConfig = {
      apiKey: "AIzaSyDqz-IP1qgXIdPGnOOJ1diy2vcJlWnJA0A",
      authDomain: "taxi-bbdda.firebaseapp.com",
      projectId: "taxi-bbdda",
      storageBucket: "taxi-bbdda.firebasestorage.app",
      messagingSenderId: "880973833007",
      appId: "1:880973833007:web:234deca6e3b83b474df7da",
      measurementId: "G-H224N62NXD"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Переключение вкладок и анимация
    const profileBtn = document.getElementById('profileBtn');
    const orderBtn = document.getElementById('orderBtn');
    const historyBtn = document.getElementById('historyBtn');
    const profileCircle = document.getElementById('profileCircle');
    const orderCircle = document.getElementById('orderCircle');
    const historyCircle = document.getElementById('historyCircle');

    function setActive(tab) {
      // Снимаем все активные классы
      profileBtn.classList.remove('active');
      orderBtn.classList.remove('active');
      historyBtn.classList.remove('active');
      // Подсвечиваем нужную вкладку
      if (tab === 'profile') {
        profileBtn.classList.add('active');
        showTab('profile');
      } else if (tab === 'history') {
        historyBtn.classList.add('active');
        showTab('history');
      } else {
        orderBtn.classList.add('active');
        showTab('order');
      }
    }

    function showTab(tab) {
      document.querySelector('.container').style.display = (tab === 'order') ? '' : 'none';
      document.getElementById('historyPanel').style.display = (tab === 'history') ? 'flex' : 'none';
      const profilePanel = document.getElementById('profilePanel');
      if (profilePanel) profilePanel.style.display = (tab === 'profile') ? 'flex' : 'none';
      if (tab === 'profile' && profilePanel) {
        // Показать номер телефона
        const phone = getUserPhone();
        document.getElementById('profilePhone').textContent = phone;
        // Показать имя
        let name = localStorage.getItem('name') || '';
        const nameText = document.getElementById('profileNameText');
        const nameInput = document.getElementById('profileNameInput');
        const nameEditBlock = document.getElementById('profileNameEditBlock');
        const editBtn = document.getElementById('profileEditBtn');
        nameText.textContent = name || 'Имя не указано';
        nameInput.value = name;
        nameEditBlock.style.display = 'none';
        nameText.style.display = '';
        editBtn.style.display = '';
        if (!name) {
          db.collection('users').where('phone', '==', phone).get().then(q => {
            if (!q.empty) {
              name = q.docs[0].data().name || '';
              localStorage.setItem('name', name);
              nameText.textContent = name || 'Имя не указано';
              nameInput.value = name;
            } else {
              nameText.textContent = 'Имя не указано';
              nameInput.value = '';
            }
          });
        }
        // Посчитать количество поездок
        db.collection('orders').where('phone', '==', phone).get().then(q => {
          document.getElementById('profileTrips').textContent = q.size;
        });
        // Назначить обработчик выхода
        const logoutBtn = document.getElementById('logoutBtn');
        if (logoutBtn) {
          logoutBtn.onclick = function() {
            localStorage.removeItem('phone');
            window.location.href = 'index.html';
          };
        }
      }
    }

    profileBtn.addEventListener('click', function() {
      setActive('profile');
    });
    orderBtn.addEventListener('click', function() {
      setActive('order');
    });
    historyBtn.addEventListener('click', function() {
      setActive('history');
      showHistoryPanel();
    });

    // Переключатель "По городу" / "Загород"
    const cityBtn = document.getElementById('cityBtn');
    const outBtn = document.getElementById('outBtn');
    const cityFields = document.getElementById('cityFields');
    const outFields = document.getElementById('outFields');
    const priceRow = document.getElementById('priceRow');
    const outPriceRow = document.getElementById('outPriceRow');
    const priceValue = document.getElementById('priceValue');
    const outPriceValue = document.getElementById('outPriceValue');
    const childSeatToggle = document.getElementById('childSeatToggle');
    const villageInput = document.getElementById('villageInput');

    cityBtn.addEventListener('click', function() {
      cityBtn.classList.add('active');
      outBtn.classList.remove('active');
      cityFields.style.display = '';
      outFields.style.display = 'none';
      priceRow.style.display = '';
      outPriceRow.style.display = 'none';
      updateCityPrice();
    });
    outBtn.addEventListener('click', function() {
      outBtn.classList.add('active');
      cityBtn.classList.remove('active');
      cityFields.style.display = 'none';
      outFields.style.display = '';
      priceRow.style.display = 'none';
      outPriceRow.style.display = '';
      updateOutPrice();
    });
    childSeatToggle.addEventListener('change', updateCityPrice);
    // При расчёте цены учитываю количество использований промокода test
    function updateCityPrice() {
      let price = 150;
      if (childSeatToggle.checked) price = 200;
      priceValue.textContent = price + ' ₽';
    }
    // Заглушка для цен по сёлам/городам
    const villagePrices = {
      // 'название': цена
      // 'Село1': 300,
      // 'Город2': 500,
    };
    function updateOutPrice() {
      const name = (villageInput.value || '').trim().toLowerCase();
      let basePrice = null;
      if (name && villagePrices[name]) {
        basePrice = villagePrices[name];
        outPriceValue.textContent = basePrice + ' ₽';
      } else if (name) {
        outPriceValue.textContent = 'уточняйте у администрации';
      } else {
        outPriceValue.textContent = '';
      }
    }
    villageInput && villageInput.addEventListener('input', updateOutPrice);

    // История заказов и анимация после заказа
    const orderSuccessOverlay = document.getElementById('orderSuccessOverlay');
    const historyPanel = document.getElementById('historyPanel');
    const historyList = document.getElementById('historyList');
    const tabInProgress = document.getElementById('tabInProgress');
    const tabDone = document.getElementById('tabDone');

    function showOrderSuccess() {
      orderSuccessOverlay.style.display = 'flex';
      setTimeout(() => {
        orderSuccessOverlay.style.opacity = 1;
        setTimeout(() => {
          orderSuccessOverlay.style.opacity = 0;
          setTimeout(() => {
            orderSuccessOverlay.style.display = 'none';
            showHistoryPanel();
          }, 400);
        }, 1800);
      }, 100);
    }

    function showHistoryPanel() {
      historyPanel.style.display = 'flex';
      renderHistory(tabInProgress.classList.contains('active') ? 'inprogress' : 'done');
    }
    function hideHistoryPanel() {
      historyPanel.style.display = 'none';
    }
    // Получаем номер телефона пользователя из localStorage (сохраняется после входа)
    function getUserPhone() {
      return localStorage.getItem('phone') || '';
    }
    // Добавление заказа в Firestore
    async function addOrderToFirestore(order) {
      await db.collection('orders').add(order);
    }
    // Получение заказов пользователя из Firestore
    async function getOrdersFromFirestore(phone) {
      const query = await db.collection('orders').where('phone', '==', phone).orderBy('created', 'desc').get();
      return query.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    }
    // Обновление статуса заказа в Firestore
    async function updateOrderStatusFirestore(id, status) {
      await db.collection('orders').doc(id).update({ status });
      renderHistory(currentHistoryTab);
    }
    function renderHistory(type) {
      const phone = getUserPhone();
      if (!phone) {
        historyList.innerHTML = '<div style="color:#FFD600;text-align:center;margin-top:32px;">Войдите для просмотра истории</div>';
        return;
      }
      getOrdersFromFirestore(phone).then(orders => {
        let filtered = [];
        if (type === 'inprogress') {
          filtered = orders.filter(o => o.status !== 'done');
        } else {
          filtered = orders.filter(o => o.status === 'done');
        }
        historyList.innerHTML = filtered.length ? filtered.map(order => `
          <div class="history-item">
            <div class="history-status">${statusText(order.status)}</div>
            <div><b>Тип:</b> ${order.type === 'city' ? 'По городу' : 'Загород'}</div>
            ${order.type === 'city' ? `
              <div><b>Откуда:</b> ${order.from}</div>
              <div><b>Куда:</b> ${order.to}</div>
              <div><b>Детское кресло:</b> ${order.childSeat ? 'Да' : 'Нет'}</div>
              <div><b>Цена:</b> ${order.price}</div>
            ` : `
              <div><b>Город/Село:</b> ${order.village}</div>
              <div><b>Улица:</b> ${order.street}</div>
              <div><b>Дом:</b> ${order.house}</div>
              <div><b>Телефон:</b> ${order.phone}</div>
              <div><b>Куда ехать:</b> ${order.outTo}</div>
              <div><b>Цена:</b> ${order.price}</div>
            `}
          </div>
        `).join('') : '<div style="color:#FFD600;text-align:center;margin-top:32px;">Нет заказов</div>';
      }).catch(error => {
        console.error("Ошибка при получении заказов:", error);
        historyList.innerHTML = '<div style="color:#FFD600;text-align:center;margin-top:32px;">Не удалось загрузить историю</div>';
      });
    }
    function statusText(status) {
      if (status === 'wait') return 'Ожидание водителя';
      if (status === 'go') return 'Поехали';
      if (status === 'done') return 'Выполнено';
      return '';
    }
    let currentHistoryTab = 'inprogress';
    tabInProgress.onclick = function() {
      tabInProgress.classList.add('active');
      tabDone.classList.remove('active');
      currentHistoryTab = 'inprogress';
      renderHistory('inprogress');
    };
    tabDone.onclick = function() {
      tabDone.classList.add('active');
      tabInProgress.classList.remove('active');
      currentHistoryTab = 'done';
      renderHistory('done');
    };
    // Показ истории по кнопке в меню
    historyBtn.addEventListener('click', function() {
      setActive('history');
      showHistoryPanel();
    });

    // Валидация формы заказа (пример)
    document.getElementById('orderForm').onsubmit = async function(e) {
      e.preventDefault();
      const isCity = cityBtn.classList.contains('active');
      const phone = getUserPhone();
      if (!phone) {
        alert('Войдите для оформления заказа!');
        return;
      }
      let order = {
        type: isCity ? 'city' : 'out',
        status: 'wait',
        phone,
        created: new Date()
      };
      if (isCity) {
        order.from = document.getElementById('fromInput').value.trim();
        order.to = document.getElementById('toInput').value.trim();
        order.childSeat = childSeatToggle.checked;
        order.price = priceValue.textContent;
        if (!order.from || !order.to) {
          alert('Пожалуйста, заполните оба поля!');
          return;
        }
      } else {
        order.village = document.getElementById('villageInput').value.trim();
        order.street = document.getElementById('streetInput').value.trim();
        order.house = document.getElementById('houseInput').value.trim();
        order.phone = document.getElementById('phoneInput').value.trim();
        order.outTo = document.getElementById('outToInput').value.trim();
        order.price = outPriceValue.textContent || 'уточняйте у администрации';
        if (!order.village || !order.street || !order.house || !order.phone || !order.outTo) {
          alert('Пожалуйста, заполните все поля!');
          return;
        }
      }
      await addOrderToFirestore(order);
      showOrderSuccess();
      document.getElementById('orderForm').reset();
      updateCityPrice();
      updateOutPrice();
    };
    // При загрузке — активна вкладка "Заказ"
    setActive('order');

    // Кнопка редактирования имени
    const profileEditBtn = document.getElementById('profileEditBtn');
    const profileNameEditBlock = document.getElementById('profileNameEditBlock');
    const profileNameText = document.getElementById('profileNameText');
    profileEditBtn.onclick = function() {
      profileNameEditBlock.style.display = '';
      profileNameText.style.display = 'none';
      profileEditBtn.style.display = 'none';
      document.getElementById('profileNameInput').focus();
    };
    // Сохранение имени с анимацией
    const profileSaveBtn = document.getElementById('profileSaveBtn');
    const profileSaveAnim = document.getElementById('profileSaveAnim');
    profileSaveBtn.onclick = async function() {
      const phone = getUserPhone();
      const name = document.getElementById('profileNameInput').value.trim();
      if (!name) {
        alert('Введите имя!');
        return;
      }
      // Обновить имя в Firestore
      const q = await db.collection('users').where('phone', '==', phone).get();
      if (!q.empty) {
        await db.collection('users').doc(q.docs[0].id).update({ name });
        localStorage.setItem('name', name);
        // Анимация сохранения
        profileSaveAnim.style.display = 'flex';
        setTimeout(() => {
          profileSaveAnim.classList.add('active');
          setTimeout(() => {
            profileSaveAnim.classList.remove('active');
            setTimeout(() => {
              profileSaveAnim.style.display = 'none';
              // После сохранения возвращаем отображение имени и шестерёнки
              profileNameEditBlock.style.display = 'none';
              profileNameText.textContent = name;
              profileNameText.style.display = '';
              profileEditBtn.style.display = '';
            }, 300);
          }, 1200);
        }, 10);
      } else {
        alert('Пользователь не найден!');
      }
    };

    // Промокод test на -50р, до 10 раз
    const profilePromoBtn = document.getElementById('profilePromoBtn');
    const profilePromoForm = document.getElementById('profilePromoForm');
    const promoInput = document.getElementById('promoInput');
    const promoActivateBtn = document.getElementById('promoActivateBtn');
    const profilePromoAnim = document.getElementById('profilePromoAnim');
    const profilePromoError = document.getElementById('profilePromoError');

    profilePromoBtn.onclick = function() {
      profilePromoForm.style.display = '';
      profilePromoBtn.style.display = 'none';
      profilePromoError.style.display = 'none';
      promoInput.value = '';
      promoInput.focus();
    };
    promoActivateBtn.onclick = async function() {
      const code = promoInput.value.trim().toLowerCase();
      const phone = getUserPhone();
      if (!code) return;
      // Проверка: промокод test, до 10 раз
      if (code === 'test') {
        // Проверяем, сколько раз уже активирован
        const userDoc = await db.collection('users').where('phone', '==', phone).get();
        if (!userDoc.empty) {
          const user = userDoc.docs[0];
          const usedPromos = user.data().usedPromos || [];
          let promoObj = usedPromos.find(p => p.code === 'test');
          let count = promoObj ? promoObj.count : 0;
          if (count >= 10) {
            profilePromoError.textContent = 'Промокод больше не доступен';
            profilePromoError.style.display = 'block';
            return;
          }
          // Сохраняем промокод в usedPromos
          let newPromos;
          if (promoObj) {
            newPromos = usedPromos.map(p => p.code === 'test' ? { code: 'test', count: count + 1 } : p);
          } else {
            newPromos = [...usedPromos, { code: 'test', count: 1 }];
          }
          await db.collection('users').doc(user.id).update({ usedPromos: newPromos });
          localStorage.setItem('promo_test_count', (count + 1).toString());
          // Анимация активации
          profilePromoAnim.style.display = 'flex';
          setTimeout(() => {
            profilePromoAnim.classList.add('active');
            setTimeout(() => {
              profilePromoAnim.classList.remove('active');
              setTimeout(() => {
                profilePromoAnim.style.display = 'none';
                profilePromoForm.style.display = 'none';
                profilePromoBtn.style.display = '';
                // Обновить цену после активации промокода
                updateCityPrice();
                updateOutPrice();
              }, 300);
            }, 1200);
          }, 10);
          profilePromoError.style.display = 'none';
        }
      } else {
        profilePromoError.textContent = 'Промокод не найден';
        profilePromoError.style.display = 'block';
      }
    };
  </script>
</body>
</html>
